[tool.poetry]
name = "bond-pricing-yield-curve-toolkit"
version = "0.1.0"
description = "Fixed income toolkit for bond pricing, curve bootstrapping, and risk analytics."
authors = ["Portfolio Builder <you@example.com>"]
readme = "README.md"
packages = [{ include = "fixed_income_toolkit", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^1.26"
pandas = "^2.2"
scipy = "^1.13"
QuantLib = "^1.36"
typer = "^0.12"
rich = "^13.7"
plotly = "^5.22"
matplotlib = "^3.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
ruff = "^0.5"
black = "^24.8"
mypy = "^1.11"
pre-commit = "^3.8"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=src/fixed_income_toolkit --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
fitool = "cli.main:app"
